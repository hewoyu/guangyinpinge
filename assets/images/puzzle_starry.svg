    <line x1="497" y1="580" x2="557" y2="580" stroke-width="4"/>
    <rect x="643" y="548" width="60" height="64" rx="10" fill="#FFD98E"/>
    <line x1="673" y1="548" x2="673" y2="612" stroke-width="4"/>
