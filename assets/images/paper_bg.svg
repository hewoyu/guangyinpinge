      <stop offset="0%" stop-color="#F2E9DC" stop-opacity="0.5"/>
      <stop offset="72%" stop-color="#F2E9DC" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E0D3BE" stop-opacity="0.35"/>
