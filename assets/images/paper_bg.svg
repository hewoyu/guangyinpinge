      <line x1="0.5" y1="0" x2="0.5" y2="7" stroke="#E7DCCB" stroke-width="0.6" opacity="0.45"/>
      <circle cx="3.2" cy="3.4" r="0.35" fill="#DFD2BE" opacity="0.5"/>
    </pattern>
    <pattern id="flecks" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="none"/>
      <line x1="12" y1="14" x2="19" y2="14" stroke="#D8CBBA" stroke-width="1" stroke-dasharray="1 3" opacity="0.7"/>
      <line x1="40" y1="38" x2="48" y2="38" stroke="#DFD2BE" stroke-width="1" stroke-dasharray="1 2.5" opacity="0.6"/>
      <line x1="22" y1="52" x2="27" y2="52" stroke="#D5C7B2" stroke-width="0.9" stroke-dasharray="1 4" opacity="0.55"/>
      <line x1="52" y1="8" x2="58" y2="8" stroke="#E0D4C2" stroke-width="0.9" stroke-dasharray="1 3" opacity="0.6"/>
      <circle cx="31" cy="27" r="0.5" fill="#D9CCB8" opacity="0.7"/>
      <circle cx="55" cy="49" r="0.45" fill="#DCCFB9" opacity="0.6"/>
