<svg xmlns="http://www.w3.org/2000/svg" width="260" height="560" viewBox="0 0 260 560">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A2418"/>
      <stop offset="30%" stop-color="#A13D30"/>
      <stop offset="62%" stop-color="#C04A38"/>
      <stop offset="100%" stop-color="#8E2A20"/>
    </linearGradient>
    <linearGradient id="capg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D26044"/>
      <stop offset="100%" stop-color="#A13D30"/>
    </linearGradient>
    <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2E8DC"/>
    </linearGradient>
  </defs>
  <!-- 筒身 -->
  <rect x="40" y="120" width="180" height="360" rx="14" fill="url(#body)" stroke="#5E1A12" stroke-width="3"/>
  <!-- 筒身高光 -->
  <rect x="58" y="130" width="14" height="340" rx="7" fill="#E8785A" opacity="0.45"/>
  <rect x="188" y="130" width="10" height="340" rx="5" fill="#5E1A12" opacity="0.35"/>
  <!-- 双层盖檐（两片扁椭圆盘） -->
  <ellipse cx="130" cy="118" rx="104" ry="20" fill="url(#capg)" stroke="#5E1A12" stroke-width="2.5"/>
  <ellipse cx="130" cy="102" rx="88" ry="16" fill="url(#capg)" stroke="#5E1A12" stroke-width="2"/>
  <!-- 齿状装饰带 -->
  <g fill="#A13D30" stroke="#5E1A12" stroke-width="1.2">
    <rect x="46" y="136" width="8" height="12" rx="2"/><rect x="62" y="138" width="8" height="12" rx="2"/>
    <rect x="78" y="139" width="8" height="12" rx="2"/><rect x="94" y="138" width="8" height="12" rx="2"/>
    <rect x="110" y="139" width="8" height="12" rx="2"/><rect x="126" y="138" width="8" height="12" rx="2"/>
    <rect x="142" y="139" width="8" height="12" rx="2"/><rect x="158" y="138" width="8" height="12" rx="2"/>
    <rect x="174" y="139" width="8" height="12" rx="2"/><rect x="190" y="138" width="8" height="12" rx="2"/>
    <rect x="206" y="136" width="8" height="12" rx="2"/>
  </g>
  <!-- 白色圆钮徽章 -->
  <circle cx="130" cy="88" r="16" fill="#F5EFE4" stroke="#5E1A12" stroke-width="2.5"/>
  <circle cx="130" cy="88" r="9" fill="none" stroke="#C9B8A0" stroke-width="1.5"/>
  <text x="130" y="94" font-family="KaiTi, serif" font-size="13" fill="#A13D30" text-anchor="middle" font-weight="bold">拾光</text>
  <!-- 投信口（拱形 内阴影） -->
  <path d="M72 172 h56 a28 22 0 0 1 56 0 v34 h-112 Z" fill="#2A1A12" stroke="#5E1A12" stroke-width="3"/>
  <rect x="72" y="198" width="112" height="8" rx="4" fill="#8E2A20" stroke="#5E1A12" stroke-width="1.5"/>
  <!-- 白色珐琅告示牌（红框白面） -->
  <rect x="76" y="248" width="108" height="92" rx="6" fill="url(#plaque)" stroke="#A13D30" stroke-width="4"/>
  <text x="130" y="286" font-family="KaiTi, serif" font-size="21" fill="#A13D30" text-anchor="middle" font-weight="bold">拾光拼途</text>
  <text x="130" y="316" font-family="KaiTi, serif" font-size="14" fill="#8A6A45" text-anchor="middle">专注时光驿站</text>
  <path d="M92 326 h76" stroke="#C9B8A0" stroke-width="1.2"/>
  <!-- 右侧门缝铰链 -->
  <line x1="216" y1="160" x2="216" y2="460" stroke="#5E1A12" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="216" cy="176" r="3" fill="#5E1A12"/>
  <circle cx="216" cy="440" r="3" fill="#5E1A12"/>
  <!-- 深色裙座 -->
  <path d="M32 470 h196 v14 l-14 36 h-168 l-14 -36 Z" fill="#55382D" stroke="#3A2A20" stroke-width="2.5"/>
  <path d="M32 484 h196" stroke="#3A2A20" stroke-width="1.8" stroke-dasharray="6 4"/>
  <!-- 线稿草地 -->
  <g stroke="#7E7A4A" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M20 552 q4 -18 -2 -26 M28 552 q-2 -14 6 -22 M12 552 q-6 -10 -4 -18"/>
    <path d="M232 552 q6 -16 0 -26 M242 552 q0 -12 8 -18 M224 552 q-8 -8 -6 -16"/>
    <path d="M120 552 q2 -12 -2 -18 M136 552 q-2 -10 4 -16 M108 552 q-6 -8 -4 -14 M150 552 q6 -10 2 -16"/>
  </g>
  <g stroke="#C8A45A" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M52 552 q3 -14 -3 -22 M66 552 q-3 -12 5 -18 M208 552 q3 -12 -3 -20 M196 552 q-5 -10 2 -16"/>
  </g>
  <!-- 地面阴影 -->
  <ellipse cx="130" cy="552" rx="110" ry="10" fill="#00000022"/>
</svg>