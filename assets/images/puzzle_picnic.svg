  </defs>

  <rect width="1200" height="900" fill="url(#skyG)"/>
  <circle cx="930" cy="170" r="200" fill="url(#sunG)"/>
  <circle cx="930" cy="170" r="62" fill="#FFE9AE" stroke="#4A3728" stroke-width="6"/>

