    <path d="M 712 726 A 46 46 0 0 1 804 726 Z" fill="#F49B8C" opacity="0.5"/>
    <circle cx="740" cy="706" r="5" fill="#4A3728"/>
    <circle cx="762" cy="698" r="5" fill="#4A3728"/>
    <circle cx="784" cy="708" r="5" fill="#4A3728"/>
  </g>
