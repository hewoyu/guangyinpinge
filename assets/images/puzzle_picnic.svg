  <!-- 蝴蝶结餐巾与果子 -->
  <circle cx="870" cy="740" r="24" fill="#E9F2DC" stroke="#4A3728" stroke-width="5"/>
  <circle cx="870" cy="740" r="10" fill="#E08E79" stroke="#4A3728" stroke-width="4"/>
  <circle cx="900" cy="795" r="16" fill="#F4B860" stroke="#4A3728" stroke-width="5"/>
  <circle cx="866" cy="812" r="13" fill="#E86A6A" stroke="#4A3728" stroke-width="5"/>

  <!-- 飞舞小蝴蝶 -->
  <g stroke="#4A3728" stroke-width="4" stroke-linejoin="round" fill="#F4D98E">
    <ellipse cx="1063" cy="588" rx="16" ry="22" transform="rotate(24 1063 588)"/>
    <ellipse cx="1094" cy="576" rx="16" ry="22" transform="rotate(-24 1094 576)"/>
    <line x1="1078" y1="580" x2="1076" y2="560" stroke-width="4"/>
