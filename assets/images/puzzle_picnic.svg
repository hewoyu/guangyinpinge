    <path d="M 620 110 Q 622 68 668 70 Q 682 40 726 52 Q 766 44 776 88 Q 812 96 806 138 Q 800 164 758 166 L 664 166 Q 618 162 620 110 Z"/>
  </g>

  <!-- 远山 -->
  <path d="M 0 560 Q 140 420 300 560 Z" fill="url(#hillG)" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 240 560 Q 420 400 600 560 Z" fill="url(#hillG2)" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 540 560 Q 700 440 860 560 Z" fill="url(#hillG)" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 800 560 Q 960 430 1130 560 Z" fill="url(#hillG2)" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>

  <!-- 草地大色块 -->
