    <path d="M 960 810 Q 954 770 966 752 M 976 810 Q 976 772 988 758 M 992 810 Q 998 778 1010 770"/>
    <path d="M 1100 780 Q 1094 744 1106 728 M 1116 780 Q 1116 746 1128 732"/>
  </g>
  <g fill="#F4B860" stroke="#4A3728" stroke-width="4">
