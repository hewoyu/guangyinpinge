  <rect x="196" y="560" width="52" height="180" rx="14" fill="#8A6B4F" stroke="#4A3728" stroke-width="6"/>
  <g fill="#9CC9A8" stroke="#4A3728" stroke-width="6" stroke-linejoin="round">
    <circle cx="222" cy="430" r="105"/>
    <circle cx="130" cy="490" r="72"/>
    <circle cx="315" cy="492" r="76"/>
  </g>
  <circle cx="196" cy="405" r="16" fill="#E9F2DC" opacity="0.85"/>
  <circle cx="255" cy="455" r="10" fill="#E9F2DC" opacity="0.7"/>

  <!-- 草丛 -->
  <g stroke="#4A3728" stroke-width="5" stroke-linecap="round" fill="none">
