<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE3D0"/>
      <stop offset="0.6" stop-color="#E9F2DC"/>
      <stop offset="1" stop-color="#FFF6E0"/>
    </linearGradient>
    <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB6A4"/>
      <stop offset="1" stop-color="#5E8B7C"/>
    </linearGradient>
    <linearGradient id="hillG2" x1="0" y1="0" x2="0" y2="1">
