<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="sand" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#F8E1B9"/>
      <stop offset="100%" stop-color="#EACB92"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8994E"/>
      <stop offset="50%" stop-color="#A5681F"/>
      <stop offset="100%" stop-color="#87581F"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A7C2D2"/>
      <stop offset="100%" stop-color="#8ABAD5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BFEDE9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7FD8D0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#sand)"/>
  <circle cx="64" cy="64" r="59" fill="url(#ring)"/>
  <circle cx="64" cy="64" r="53" fill="#FFF6C6"/>
  <!-- 顶部天空带 -->
  <clipPath id="badge"><circle cx="64" cy="64" r="53"/></clipPath>
  <g clip-path="url(#badge)">
    <rect x="11" y="11" width="106" height="26" fill="url(#sky)"/>
    <ellipse cx="46" cy="24" rx="12" ry="5.5" fill="#FFFFFF" opacity="0.92"/>
    <ellipse cx="55" cy="27" rx="8" ry="4" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="84" cy="21" rx="10" ry="4.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- 左上灰蓝拼图片（带凹口） -->
    <path d="M18 18 h16 c0 5 8 5 8 0 h16 v16 c5 0 5 8 0 8 v16 h-16 c0 5-8 5-8 0 h-16 v-16 c-5 0-5-8 0-8 z"
          fill="#A8C4C8" stroke="#8FA8B0" stroke-width="1.5" transform="translate(14,14) scale(0.62)" opacity="0.95"/>
    <!-- 右下暖赭拼图片（带凸榫） -->
    <path d="M0 0 h20 c0 -6 10 -6 10 0 h20 v20 c6 0 6 10 0 10 v20 h-20 c0 6 -10 6 -10 0 h-20 v-20 c-6 0 -6 -10 0 -10 z"
          fill="#EECD8D" stroke="#B98A45" stroke-width="1.5" transform="translate(62,66) scale(0.62)"/>
    <path d="M0 0 h20 c0 -6 10 -6 10 0 h20 v20 c6 0 6 10 0 10 v20 h-20 c0 6 -10 6 -10 0 h-20 v-20 c-6 0 -6 -10 0 -10 z"
          fill="none" stroke="#C99A55" stroke-width="2" transform="translate(64,69) scale(0.62)" opacity="0.7"/>
    <!-- 信纸（斜放） -->
    <g transform="rotate(-8 64 66)">
      <rect x="30" y="42" width="68" height="56" rx="2" fill="#FFF6DE" stroke="#D8B87A" stroke-width="1"/>
      <!-- 航线虚线 + 纸飞机 -->
      <path d="M36 84 Q54 66 78 60 T96 54" fill="none" stroke="#B09468" stroke-width="1.2" stroke-dasharray="3 3"/>
      <path d="M94 50 l7 3 -6 4 -1 -3 z" fill="#F5E9CF" stroke="#A98C67" stroke-width="1"/>
      <!-- 邮戳 -->
      <circle cx="42" cy="92" r="8" fill="none" stroke="#96874C" stroke-width="1.4" opacity="0.85"/>
      <circle cx="42" cy="92" r="5" fill="none" stroke="#96874C" stroke-width="0.8" opacity="0.6"/>
    </g>
    <!-- 毛笔主字：拾光 / 拼途 -->
    <text x="64" y="62" font-family="KaiTi, STKaiti, serif" font-size="24" font-weight="bold"
          fill="#3A1C00" text-anchor="middle" dominant-baseline="central" letter-spacing="2">拾光</text>
    <text x="64" y="88" font-family="KaiTi, STKaiti, serif" font-size="24" font-weight="bold"
          fill="#3A1C00" text-anchor="middle" dominant-baseline="central" letter-spacing="2">拼途</text>
    <!-- 左下橘色水彩花 -->
    <g transform="translate(30,100)">
      <ellipse cx="0" cy="0" rx="4" ry="7" fill="#E0A878" transform="rotate(0)"/>
      <ellipse cx="0" cy="0" rx="4" ry="7" fill="#E8B58C" transform="rotate(72)"/>
      <ellipse cx="0" cy="0" rx="4" ry="7" fill="#E0A878" transform="rotate(144)"/>
      <ellipse cx="0" cy="0" rx="4" ry="7" fill="#EBBF97" transform="rotate(216)"/>
      <ellipse cx="0" cy="0" rx="4" ry="7" fill="#E0A878" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="2.5" fill="#AD7B45"/>
      <path d="M0 7 Q4 14 2 20" fill="none" stroke="#A6A46E" stroke-width="2"/>
      <ellipse cx="5" cy="15" rx="4" ry="2" fill="#A6A46E" transform="rotate(-30 5 15)"/>
    </g>
  </g>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#87581F" stroke-width="2"/>
  <circle cx="64" cy="64" r="61.5" fill="none" stroke="#FFE2B6" stroke-width="1.5"/>
</svg>